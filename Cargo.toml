[package]
name = "taskbar-usage-widget"
version = "1.3.0"
description = "Claude, Codex and Spark usage in the Windows taskbar"
license = "MIT"
repository = "https://github.com/michaelinghilterra-creator/taskbar-usage-widget"
edition = "2021"

[dependencies]
serde_json = "1.0.154"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_System_Time", "Win32_System_Power", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell_Common"] }

[features]
# Dev-only menu options (also always on in debug builds).
dev = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
